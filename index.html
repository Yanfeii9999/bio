<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Yanfeii_9999</title>
    <link rel="icon" type="image/png" href="logo.png">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Plus Jakarta Sans', sans-serif; -webkit-user-select: none; user-select: none; }
        body { background-color: #0b0b0e; color: #ffffff; min-height: 100vh; display: flex; justify-content: center; align-items: center; overflow-x: hidden; position: relative; }
        
        .bg-image { 
            position: fixed; 
            top: 0; 
            left: 0; 
            width: 100%; 
            height: 100%; 
            object-fit: cover; 
            z-index: -3; 
            filter: brightness(0.4) blur(3px); 
            transform: scale(1.05); 
            pointer-events: none; 
        }

        .bg-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.4); z-index: -2; pointer-events: none; }
        
        #snow-canvas { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -1; pointer-events: none; }

        .container { width: 100%; max-width: 400px; padding: 20px; z-index: 1; display: flex; flex-direction: column; gap: 12px; }

        .discord-profile-card { background: rgba(24, 25, 28, 0.7); backdrop-filter: blur(14px); border-radius: 16px; overflow: hidden; box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5); border: 1px solid rgba(255, 255, 255, 0.08); }
        .discord-banner { width: 100%; height: 100px; object-fit: cover; background: #2b2d31; pointer-events: none; }
        .discord-body { padding: 0 14px 14px 14px; position: relative; }
        
        .discord-avatar-container { position: relative; width: 70px; height: 70px; margin-top: -40px; margin-bottom: 8px; }
        .discord-avatar { width: 100%; height: 100%; border-radius: 50%; object-fit: cover; border: 4px solid #18191c; pointer-events: none; }
        
        .discord-username-area { margin-bottom: 10px; }
        .discord-display-name { font-size: 1.15rem; font-weight: 700; color: #f2f3f5; display: flex; align-items: center; gap: 6px; }
        .discord-username { font-size: 0.8rem; color: #949ba4; }

        .discord-bio { font-size: 0.82rem; color: #dbdee1; line-height: 1.4; background: rgba(17, 18, 20, 0.4); padding: 10px; border-radius: 8px; word-break: break-word; border: 1px solid rgba(255, 255, 255, 0.04); }
        .discord-bio a { color: #00a8fc; text-decoration: none; }

        .music-player-card {
            background: rgba(24, 25, 28, 0.7);
            backdrop-filter: blur(14px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 14px;
            padding: 10px 14px;
            display: flex;
            align-items: center;
            gap: 12px;
            width: 100%;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }
        
        .player-thumb { 
            width: 45px; 
            height: 45px; 
            border-radius: 50%; 
            object-fit: cover; 
            flex-shrink: 0; 
            border: 2px solid #ff2a85;
            animation: spinVinyl 6s linear infinite;
            animation-play-state: paused; 
        }

        @keyframes spinVinyl {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .player-info { flex-grow: 1; display: flex; flex-direction: column; gap: 4px; min-width: 0; }
        .player-title { color: #ff2a85; font-weight: 700; font-size: 0.85rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .player-progress-area { display: flex; align-items: center; gap: 8px; }
        .player-time { font-size: 0.7rem; color: #ff75b5; width: 28px; flex-shrink: 0; }
        .progress-bar-container { flex-grow: 1; height: 5px; background: rgba(255, 255, 255, 0.15); border-radius: 3px; position: relative; cursor: pointer; }
        .progress-bar-filled { height: 100%; background: #ff2a85; border-radius: 3px; width: 0%; position: relative; }
        .progress-handle { position: absolute; right: -4px; top: -3.5px; width: 11px; height: 11px; background: #ffffff; border-radius: 50%; box-shadow: 0 0 4px rgba(0,0,0,0.5); }
        
        .player-controls { display: flex; align-items: center; gap: 10px; flex-shrink: 0; }
        .control-btn { background: none; border: none; color: #ff2a85; font-size: 0.95rem; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: transform 0.1s; }
        .control-btn:active { transform: scale(0.9); }
        .play-pause-btn { width: 34px; height: 34px; background: #ff2a85; color: #ffffff; border-radius: 50%; font-size: 0.9rem; }

        .social-icons { display: flex; justify-content: center; gap: 12px; margin-top: 4px; }
        .social-btn { width: 40px; height: 40px; background: rgba(24, 25, 28, 0.7); backdrop-filter: blur(10px); border-radius: 50%; display: flex; align-items: center; justify-content: center; color: #dbdee1; font-size: 1.1rem; text-decoration: none; border: 1px solid rgba(255, 255, 255, 0.08); transition: transform 0.2s; }
        .social-btn:hover { transform: scale(1.1); }

        .views-counter { position: fixed; bottom: 20px; left: 20px; display: inline-flex; align-items: center; gap: 6px; background: rgba(0, 0, 0, 0.6); backdrop-filter: blur(10px); padding: 6px 12px; border-radius: 20px; font-size: 0.8rem; color: #d4d4d8; z-index: 1000; }
    </style>
</head>
<body>
    <img src="https://media1.giphy.com/media/v1.Y2lkPTc5MGI3NjExaDYyaXk4bWcxZHdobXZzdTIyN3owdXZoazJvczNzY3V3eXdma2x4NiZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9Zw/wkDoOUYiSEruIAkyaD/giphy.gif" alt="Background GIF" class="bg-image">
    <div class="bg-overlay"></div>
    <canvas id="snow-canvas"></canvas>
    
    <audio id="bg-music"></audio>

    <div class="views-counter"><i class="fa-regular fa-eye"></i> <span id="view-count">5</span></div>

    <div class="container">
        <div class="discord-profile-card">
            <img src="sonthuytrungmaysau.png" alt="Banner" class="discord-banner">
            <div class="discord-body">
                <div class="discord-avatar-container">
                    <img src="logo.png" alt="Avatar" class="discord-avatar">
                </div>
                <div class="discord-username-area">
                    <div class="discord-display-name">Yanfeii_9999</div>
                    <div class="discord-username">valor_sakura</div>
                </div>
                <div class="discord-bio">
                    Admin server Minecraft<br><strong>SAKURA SMP</strong><br>
                    <a href="https://discord.gg/jchMgVN2u" target="_blank">https://discord.gg/jchMgVN2u</a><br><br>
                    💻 Dev: HTML, CSS, JS, C++, PYTHON<br>🗄️ Database: MySQL, SQL Server<br>🎨 Design: Web + Poster<br>🚀 Leader dự án 1 team coreexpress<br>HLV vovinam
                </div>
            </div>
        </div>

        <div class="music-player-card">
            <img src="logo.png" alt="Thumbnail" class="player-thumb" id="player-thumb">
            <div class="player-info">
                <div class="player-title" id="player-title">Yanfeii_9999</div>
                <div class="player-progress-area">
                    <span class="player-time" id="current-time">0:00</span>
                    <div class="progress-bar-container" id="progress-container">
                        <div class="progress-bar-filled" id="progress-filled">
                            <div class="progress-handle"></div>
                        </div>
                    </div>
                    <span class="player-time" id="duration-time">0:00</span>
                </div>
            </div>
            <div class="player-controls">
                <button class="control-btn" id="prev-btn" title="Bài trước"><i class="fa-solid fa-backward-step"></i></button>
                <button class="control-btn play-pause-btn" id="play-pause-btn" title="Phát/Tạm dừng"><i class="fa-solid fa-play" id="play-pause-icon"></i></button>
                <button class="control-btn" id="next-btn" title="Bài tiếp theo"><i class="fa-solid fa-forward-step"></i></button>
            </div>
        </div>

        <div class="social-icons">
            <a href="https://discord.gg/8thR9ZDf" target="_blank" class="social-btn"><i class="fa-brands fa-discord" style="color: #5865F2;"></i></a>
            <a href="https://www.instagram.com/luuquangtronghistory/" target="_blank" class="social-btn"><i class="fa-brands fa-instagram" style="color: #E4405F;"></i></a>
            <a href="https://www.facebook.com/trongquangluu2026" target="_blank" class="social-btn"><i class="fa-brands fa-facebook" style="color: #0866FF;"></i></a>
        </div>
    </div>

    <script>
        document.addEventListener('contextmenu', e => e.preventDefault());
        document.addEventListener('keydown', e => {
            if (e.key === 'F12' || e.keyCode === 123 || (e.ctrlKey && ['c','C','v','V','x','X','u','U','s','S','p','P','a','A'].includes(e.key))) {
                e.preventDefault();
                return false;
            }
        });
        ['copy', 'cut', 'paste', 'dragstart'].forEach(ev => document.addEventListener(ev, e => e.preventDefault()));

        const canvas = document.getElementById('snow-canvas');
        const ctx = canvas.getContext('2d');
        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        class Snowflake {
            constructor() {
                this.reset();
            }
            reset() {
                this.x = Math.random() * canvas.width;
                this.y = Math.random() * -canvas.height;
                this.size = Math.random() * 3.5 + 1;
                this.speedY = Math.random() * 1 + 0.5;
                this.speedX = Math.random() * 0.6 - 0.3;
                this.opacity = Math.random() * 0.6 + 0.4;
                this.angle = Math.random() * Math.PI * 2;
                this.spin = Math.random() * 0.02 - 0.01;
            }
            update() {
                this.angle += this.spin;
                this.y += this.speedY;
                this.x += this.speedX + Math.sin(this.angle) * 0.4;

                if (this.y > canvas.height + 10 || this.x < -10 || this.x > canvas.width + 10) {
                    this.reset();
                }
            }
            draw() {
                ctx.save();
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fillStyle = `rgba(255, 255, 255, ${this.opacity})`;
                ctx.shadowBlur = 6;
                ctx.shadowColor = "#ffffff";
                ctx.fill();
                ctx.restore();
            }
        }

        const snowflakes = Array.from({ length: 60 }, () => new Snowflake());
        function animateSnow() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            snowflakes.forEach(flake => {
                flake.update();
                flake.draw();
            });
            requestAnimationFrame(animateSnow);
        }
        animateSnow();

        let playlist = [
            { title: "Yanfeii_9999", src: "thuy-chung.mp3", thumb: "sonthuytrungmaysau.png" },
            { title: "Yanfeii_9999", src: "bong-hoa-chang-ton-tai.mp3", thumb: "logo.png" },
            { title: "Yanfeii_9999", src: "roi-le.mp3", thumb: "sonthuytrungmaysau.png" },
            { title: "Yanfeii_9999", src: "yen-vo-hiet.mp3", thumb: "logo.png" },
            { title: "Yanfeii_9999", src: "co-dai-va-hoa-danh-danh.mp3", thumb: "sonthuytrungmaysau.png" },
            { title: "Yanfeii_9999", src: "Noi-co-phao-hoa-ruc-ro.mp3", thumb: "logo.png" },
            { title: "Yanfeii_9999", src: "lac-tu-quyet.mp3", thumb: "logo.png" },
            { title: "Yanfeii_9999", src: "son-thuy-trung-may.mp3", thumb: "logo.png" },
            { title: "Yanfeii_9999", src: "Quan-son-tuu.mp3", thumb: "logo.png" }
        ];

        let currentSongIndex = 0;
        const audio = document.getElementById('bg-music');
        const titleElem = document.getElementById('player-title');
        const thumbElem = document.getElementById('player-thumb');
        const playPauseBtn = document.getElementById('play-pause-btn');
        const playPauseIcon = document.getElementById('play-pause-icon');
        const prevBtn = document.getElementById('prev-btn');
        const nextBtn = document.getElementById('next-btn');
        const progressContainer = document.getElementById('progress-container');
        const progressFilled = document.getElementById('progress-filled');
        const currentTimeElem = document.getElementById('current-time');
        const durationTimeElem = document.getElementById('duration-time');

        audio.volume = 0.5;

        function loadSong(index) {
            if (playlist.length === 0) return;
            currentSongIndex = index;
            audio.src = playlist[index].src;
            titleElem.innerText = playlist[index].title;
            thumbElem.src = playlist[index].thumb || "logo.png";
            audio.load();
        }

        function togglePlay() {
            if (playlist.length === 0) return;
            if (audio.paused) {
                audio.play().then(() => {
                    playPauseIcon.className = "fa-solid fa-pause";
                    thumbElem.style.animationPlayState = "running";
                }).catch(() => {});
            } else {
                audio.pause();
                playPauseIcon.className = "fa-solid fa-play";
                thumbElem.style.animationPlayState = "paused";
            }
        }

        function nextSong() {
            if (playlist.length === 0) return;
            currentSongIndex = (currentSongIndex + 1) % playlist.length;
            loadSong(currentSongIndex);
            audio.play().then(() => {
                playPauseIcon.className = "fa-solid fa-pause";
                thumbElem.style.animationPlayState = "running";
            }).catch(() => {});
        }

        function prevSong() {
            if (playlist.length === 0) return;
            currentSongIndex = (currentSongIndex - 1 + playlist.length) % playlist.length;
            loadSong(currentSongIndex);
            audio.play().then(() => {
                playPauseIcon.className = "fa-solid fa-pause";
                thumbElem.style.animationPlayState = "running";
            }).catch(() => {});
        }

        playPauseBtn.addEventListener('click', togglePlay);
        nextBtn.addEventListener('click', nextSong);
        prevBtn.addEventListener('click', prevSong);

        progressContainer.addEventListener('click', (e) => {
            const rect = progressContainer.getBoundingClientRect();
            const pos = (e.clientX - rect.left) / rect.width;
            if (audio.duration) {
                audio.currentTime = pos * audio.duration;
            }
        });

        function formatTime(seconds) {
            const m = Math.floor(seconds / 60);
            const s = Math.floor(seconds % 60);
            return `${m}:${s < 10 ? '0' : ''}${s}`;
        }

        audio.addEventListener('timeupdate', () => {
            if (audio.duration) {
                const percent = (audio.currentTime / audio.duration) * 100;
                progressFilled.style.width = percent + '%';
                currentTimeElem.innerText = formatTime(audio.currentTime);
                durationTimeElem.innerText = formatTime(audio.duration);
            }
        });

        audio.addEventListener('ended', () => {
            nextSong();
        });

        loadSong(0);
        audio.play().then(() => {
            playPauseIcon.className = "fa-solid fa-pause";
            thumbElem.style.animationPlayState = "running";
        }).catch(() => {
            const unlock = () => {
                audio.play().then(() => {
                    playPauseIcon.className = "fa-solid fa-pause";
                    thumbElem.style.animationPlayState = "running";
                    document.removeEventListener('click', unlock);
                    document.removeEventListener('keydown', unlock);
                }).catch(() => {});
            };
            document.addEventListener('click', unlock);
            document.addEventListener('keydown', unlock);
        });

        async function checkNewSongsFromGitHub() {
            try {
                const response = await fetch(`https://api.github.com/repos/Yanfeii9999/bio/contents?ref=main`);
                const files = await response.json();
                const mp3Files = files.filter(file => file.name.endsWith('.mp3'));
                
                if (mp3Files.length > 0) {
                    playlist = mp3Files.map(file => ({
                        title: "Yanfeii_9999",
                        src: file.download_url,
                        thumb: "logo.png"
                    }));
                }
            } catch (error) {
                console.error("Lỗi đồng bộ ngầm:", error);
            }
        }
        checkNewSongsFromGitHub();

        let views = localStorage.getItem('profile_views');
        views = !views ? 5 : parseInt(views) + 1;
        localStorage.setItem('profile_views', views);
        const viewElem = document.getElementById('view-count');
        if (viewElem) viewElem.innerText = views;
    </script>
</body>
</html>
